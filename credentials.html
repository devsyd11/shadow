<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved credentials – Login Saver</title>
  <link rel="stylesheet" href="credentials.css">
</head>
<body>
  <div class="app">
    <header class="header-bar">
      <div class="header-left">
        <img src="shadow_icon.png" alt="" class="header-icon" width="32" height="32">
        <span class="header-title">Property Room</span>
      </div>
      <div class="header-right">
        <input type="text" id="search" class="search-input" placeholder="Search site or username…" autocomplete="off">
      </div>
    </header>

    <main class="main">
      <div class="table-wrap">
        <table class="cred-table">
          <thead>
            <tr>
              <th class="col-site">Website</th>
              <th class="col-username">Username</th>
              <th class="col-password">Password</th>
              <th class="col-saved">Saved</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
      <div id="empty" class="empty-state hidden">
        <p>No saved credentials yet.</p>
        <p>Log in on any website; when the login succeeds, your username and password are saved here.</p>
      </div>
    </main>

    <footer class="footer-bar">
      <span id="recordCount" class="record-count">Showing 0 record(s)</span>
      <div class="footer-actions">
        <button type="button" id="clearAll" class="btn btn-footer">Clear all</button>
      </div>
    </footer>
  </div>
  <script src="credentials.js"></script>
</body>
</html>
